[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "andor-emccd"
version = "0.3.1"
description = "Client for the Andor iXon EMCCD backend service (ZeroMQ)"
requires-python = ">=3.8"
dependencies = ["numpy", "pyzmq"]

[project.optional-dependencies]
recording = ["tifffile"]

[tool.setuptools]
packages = ["andor_emccd"]
